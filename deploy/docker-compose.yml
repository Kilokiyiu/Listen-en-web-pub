services:
  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management
    container_name: listen_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.4"
    mem_limit: 256m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SQL Server 数据库
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: listen_sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -Q \"SELECT 1\" -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # IdentityService 认证服务
  identity-service:
    build:
      context: ..
      dockerfile: deploy/IdentityService.WebAPI/Dockerfile
    container_name: listen_identity
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseConnStr=Server=sqlserver;Database=Listen_En_Web_identity;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - JWT_KEY=${JWT_KEY}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - CorsOrigins__0=${CORS_ORIGIN_0:-https://your-domain.com}
      - CorsOrigins__1=${CORS_ORIGIN_1:-https://www.your-domain.com}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

  # ListenService 听力服务
  listen-service:
    build:
      context: ..
      dockerfile: deploy/ListenService.WebAPI/Dockerfile
    container_name: listen_service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseConnStr=Server=sqlserver;Database=Listen_En_Web_listen;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - JWT_KEY=${JWT_KEY}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - CorsOrigins__0=${CORS_ORIGIN_0:-https://your-domain.com}
      - CorsOrigins__1=${CORS_ORIGIN_1:-https://www.your-domain.com}
    volumes:
      - ./audios:/app/wwwroot/audios  # 音频文件挂载（本地目录 deploy/audios/）
      - ./papers:/app/wwwroot/papers  # 试卷/答案 PDF
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

  # ArticleService 文章服务
  article-service:
    build:
      context: ..
      dockerfile: deploy/ArticleService.WebAPI/Dockerfile
    container_name: listen_article
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseConnStr=Server=sqlserver;Database=Listen_En_Web_article;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - JWT_KEY=${JWT_KEY}
      - CorsOrigins__0=${CORS_ORIGIN_0:-https://your-domain.com}
      - CorsOrigins__1=${CORS_ORIGIN_1:-https://www.your-domain.com}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

  # WordService 词根学习服务
  word-service:
    build:
      context: ..
      dockerfile: deploy/WordService.WebAPI/Dockerfile
    container_name: listen_word
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseConnStr=Server=sqlserver;Database=Listen_En_Web_word;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - JWT_KEY=${JWT_KEY}
      - CorsOrigins__0=${CORS_ORIGIN_0:-https://your-domain.com}
      - CorsOrigins__1=${CORS_ORIGIN_1:-https://www.your-domain.com}
      - XxApi__ApiKey=${XXAPI_API_KEY:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

  # Certbot - Let's Encrypt 证书自动申请和续期
  certbot:
    image: certbot/certbot
    container_name: listen_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $$; done;'"
    restart: unless-stopped

  # Nginx 反向代理 + 静态文件服务
  nginx:
    image: nginx:stable
    container_name: listen_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./user-ui:/usr/share/nginx/user-ui:ro
      - ./admin-ui:/usr/share/nginx/admin-ui:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - identity-service
      - listen-service
      - article-service
      - word-service
    restart: always

volumes:
  sqlserver_data:
  rabbitmq_data:
