worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

        gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml text/javascript application/xml+rss image/svg+xml font/woff font/woff2;

    upstream listen_backend {
        server listen-service:8080;
    }

    upstream identity_backend {
        server identity-service:8080;
    }

    upstream article_backend {
        server article-service:8080;
    }

    upstream word_backend {
        server word-service:8080;
    }

    # HTTP server - redirect to HTTPS + Let's Encrypt challenge
    server {
        listen 80;
        server_name listenease.online www.listenease.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://listenease.online$request_uri;
        }
    }

    # HTTPS: www 统一跳转到主域名，避免搜索引擎分散权重
    server {
        listen 443 ssl http2;
        server_name www.listenease.online;

        ssl_certificate /etc/letsencrypt/live/listenease.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/listenease.online/privkey.pem;

        return 301 https://listenease.online$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name listenease.online;

        ssl_certificate /etc/letsencrypt/live/listenease.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/listenease.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 100m;

        # Admin 静态资源 - ^~ 阻止正则匹配
        location ^~ /admin/assets/ {
            alias /usr/share/nginx/admin-ui/assets/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /admin/ {
            alias /usr/share/nginx/admin-ui/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
        }

        # 静态资源缓存 - JS/CSS
        location ~* \.(js|css)$ {
            root /usr/share/nginx/user-ui;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 静态资源缓存 - 图片
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/user-ui;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            root /usr/share/nginx/user-ui;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/listen/ {
            proxy_pass http://listen_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/identity/ {
            proxy_pass http://identity_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/article/ {
            proxy_pass http://article_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/word/ {
            proxy_pass http://word_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
