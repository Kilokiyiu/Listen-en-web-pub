name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========== 检测哪些服务有代码变更 ==========
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      listen: ${{ steps.filter.outputs.listen }}
      article: ${{ steps.filter.outputs.article }}
      word: ${{ steps.filter.outputs.word }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any-backend: ${{ steps.filter.outputs.any_backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'IdentitySerivce/**'
              - 'Commons/MyEventController/**'
              - 'Commons/MyJWT/**'
              - 'deploy/IdentityService.WebAPI/Dockerfile'
            listen:
              - 'ListenService/**'
              - 'Commons/MyCache/**'
              - 'Commons/MyEventController/**'
              - 'Commons/MyJWT/**'
              - 'deploy/ListenService.WebAPI/Dockerfile'
              - 'deploy/nginx/nginx.conf'
            article:
              - 'ArticleService/**'
              - 'deploy/ArticleService.WebAPI/Dockerfile'
            word:
              - 'WordService/**'
              - 'deploy/WordService.WebAPI/Dockerfile'
            any_backend:
              - 'IdentitySerivce/**'
              - 'ListenService/**'
              - 'ArticleService/**'
              - 'WordService/**'
              - 'Commons/MyEventController/**'
              - 'Commons/MyCache/**'
              - 'Commons/MyJWT/**'
              - 'deploy/IdentityService.WebAPI/Dockerfile'
              - 'deploy/ListenService.WebAPI/Dockerfile'
              - 'deploy/ArticleService.WebAPI/Dockerfile'
              - 'deploy/WordService.WebAPI/Dockerfile'
              - 'deploy/docker-compose.yml'
              - 'deploy/nginx/nginx.conf'
              - '.dockerignore'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'Front end/**'

  # ========== 部署（构建镜像 + 推送容器）==========
  build-and-deploy:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ---- 构建前端（始终执行，确保不被 git reset 覆盖）----
    - name: Build user-ui
      working-directory: Front end/en-listen-user-ui
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        npm install
        npm run build
        cd dist && tar -czf "$WORKSPACE/user-ui-dist.tar.gz" . && cd ..

    - name: Build admin-ui
      working-directory: Front end/en-listen-admin-ui
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        npm install
        npm run build
        cd dist && tar -czf "$WORKSPACE/admin-ui-dist.tar.gz" . && cd ..

    # ---- 同步代码到服务器 ----
    - name: Sync repository to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        command_timeout: 2m
        script: |
          set -e
          cd /opt/your-project
          git fetch origin main
          git reset --hard origin/main

    # ---- 上传前端文件（始终执行）----
    - name: Upload user-ui
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "user-ui-dist.tar.gz"
        target: "/opt/your-project/deploy/"

    - name: Upload admin-ui
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "admin-ui-dist.tar.gz"
        target: "/opt/your-project/deploy/"

    # ---- 部署容器（构建镜像 + 重启服务）----
    - name: Build & deploy containers
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        command_timeout: 15m
        script: |
          cd /opt/your-project/deploy

          # 提取前端文件
          if [ -f user-ui-dist.tar.gz ]; then
            mkdir -p user-ui admin-ui
            tar -xzf user-ui-dist.tar.gz -C user-ui/
            tar -xzf admin-ui-dist.tar.gz -C admin-ui/
            rm -f user-ui-dist.tar.gz admin-ui-dist.tar.gz
          fi

          CHANGED=""

          # 安全重建容器（规避 docker-compose 1.29 + 新 Docker 的 ContainerConfig 错误）
          recreate_service() {
            local svc="$1"
            local cname="$2"
            docker rm -f "$cname" 2>/dev/null || true
            docker-compose up -d --no-deps "$svc" || true
          }

          # 仅在容器未运行时才启动，避免无谓 recreate 基础设施
          ensure_running() {
            local cname="$1"
            local svc="$2"
            if docker ps --format '{{.Names}}' | grep -qx "$cname"; then
              echo ">>> $cname is running"
              return 0
            fi
            if docker ps -a --format '{{.Names}}' | grep -qx "$cname"; then
              echo ">>> Starting $cname"
              docker start "$cname" || docker-compose up -d --no-deps "$svc" || true
            else
              echo ">>> Creating $cname"
              docker-compose up -d --no-deps "$svc" || true
            fi
          }

          wait_for_service() {
            local cname="$1"
            local max="${2:-30}"
            local i=1
            while [ "$i" -le "$max" ]; do
              if docker ps --format '{{.Names}}' | grep -qx "$cname"; then
                return 0
              fi
              sleep 2
              i=$((i + 1))
            done
            echo ">>> WARNING: $cname not running after wait"
            return 1
          }

          # ---- 按需构建镜像 ----
          if [ "${{ needs.detect-changes.outputs.identity }}" == "true" ]; then
            echo ">>> Building identity-service..."
            docker-compose build identity-service
            CHANGED="$CHANGED identity-service"
          fi

          if [ "${{ needs.detect-changes.outputs.listen }}" == "true" ]; then
            echo ">>> Building listen-service..."
            docker-compose build listen-service
            CHANGED="$CHANGED listen-service"
          fi

          if [ "${{ needs.detect-changes.outputs.article }}" == "true" ]; then
            echo ">>> Building article-service..."
            docker-compose build article-service
            CHANGED="$CHANGED article-service"
          fi

          if [ "${{ needs.detect-changes.outputs.word }}" == "true" ]; then
            echo ">>> Building word-service..."
            docker-compose build word-service
            CHANGED="$CHANGED word-service"
          fi

          # ---- 基础设施（不删除已有容器）----
          ensure_running listen_sqlserver sqlserver
          ensure_running listen_rabbitmq rabbitmq

          # ---- 仅重建有代码变更的服务 ----
          if [ -n "$CHANGED" ]; then
            echo ">>> Recreating changed containers:$CHANGED"
            for svc in $CHANGED; do
              case "$svc" in
                identity-service) recreate_service identity-service listen_identity ;;
                listen-service)   recreate_service listen-service listen_service ;;
                article-service)  recreate_service article-service listen_article ;;
                word-service)     recreate_service word-service listen_word ;;
              esac
            done
          fi

          # ---- 重启 nginx（加载最新静态文件）----
          echo ">>> Restarting nginx..."
          recreate_service nginx listen_nginx

          # ---- 确认核心服务在线（只启动，不强制重建）----
          echo ">>> Verifying core services..."
          ensure_running listen_sqlserver sqlserver
          ensure_running listen_rabbitmq rabbitmq
          ensure_running listen_identity identity-service
          ensure_running listen_service listen-service
          ensure_running listen_article article-service
          ensure_running listen_word word-service
          ensure_running listen_nginx nginx

          wait_for_service listen_service 45 || docker logs listen_service --tail 40 || true

          echo ">>> Verifying listen-service API..."
          docker exec listen_nginx wget -qO- http://listen-service:8080/api/listen/health \
            || docker exec listen_nginx wget -qO- http://listen-service:8080/health \
            || docker logs listen_service --tail 60 || true

          echo ">>> Container status:"
          docker-compose ps

          echo ">>> Deploy completed at $(date)"

          # ========== 清理构建产物 ==========
          echo ">>> Cleaning up build artifacts..."

          # 清理 Docker 未使用的镜像和缓存
          echo ">>> Pruning Docker images..."
          docker image prune -a -f

          echo ">>> Pruning Docker build cache..."
          docker builder prune -a -f

          echo ">>> Pruning Docker system (containers, networks, caches)..."
          docker system prune -f

          # 清理服务器上的前端构建缓存（保留 user-ui 和 admin-ui）
          echo ">>> Cleaning frontend build cache..."
          cd /opt/your-project/deploy
          rm -f user-ui-dist.tar.gz admin-ui-dist.tar.gz
          # 清理旧的 chunk-vendors.*.map 和 assets 缓存文件
          find user-ui -name "*.map" -type f -delete 2>/dev/null || true
          find admin-ui -name "*.map" -type f -delete 2>/dev/null || true

          echo ">>> Cleanup completed at $(date)"
          echo ">>> Disk usage after cleanup:"
          df -h /
